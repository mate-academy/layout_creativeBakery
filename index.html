<!doctype html>
<html
  lang="en"
  class="page"
>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Bakerlab</title>

    <link
      rel="stylesheet"
      href="src/styles/main.scss"
    />

    <link
      rel="icon"
      type="favicon"
      sizes="32x32"
      href="./src/images/favicon-32x32.png"
    />

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
  </head>

  <body class="page__body">
    <header class="header">
      <a
        href="#"
        class="header__logo-link"
      >
        <img
          src="./src/images/logo.png"
          alt="Bakerlab logo"
          class="header__logo"
        />
      </a>

      <nav class="header__nav">
        <ul class="header__list">
          <li class="header__item">
            <a
              href="#"
              class="header__link"
            >
              Products
            </a>
          </li>
          <li class="header__item">
            <a
              href="#"
              class="header__link"
            >
              About Us
            </a>
          </li>
          <li class="header__item">
            <a
              href="#"
              class="header__link"
            >
              Blog
            </a>
          </li>
          <li class="header__item">
            <a
              href="#"
              class="header__link header__link--contact"
            >
              <span class="icon icon--phone"></span>
              CONTACT US
            </a>
          </li>
        </ul>
      </nav>

      <a
        href="#mobile-menu"
        class="header__burger"
      >
        <span class="icon icon--menu"></span>
      </a>
    </header>

    <!-- <div class="mobile-menu" id="mobile-menu">

    </div> -->

    <main class="main">
      <section class="hero container">
        <p class="hero__intro">
          We bake your fantasies — croissants, cakes, cookies, and cupcakes.
        </p>

        <h1 class="hero__title">Creative bakery</h1>

        <div class="hero__image-wrap">
          <img
            src="./src/images/cookie.png"
            alt="Choclate cookie"
            class="hero__image"
          />
        </div>
        <a
          href="#"
          class="hero__button hero__button--disabled-"
        >
          <span class="icon hero__button-icon"></span>
          Learn more
        </a>
      </section>

      <section
        class="products container"
        id="products"
      >
        What we bake
      </section>

      <section
        class="about-us"
        id="about-us"
      >
        Few words About us
      </section>
    </main>
    <footer
      class="contacts"
      id="contacts"
    ></footer>
    <script src="src/scripts/main.js"></script>
  </body>
</html>
