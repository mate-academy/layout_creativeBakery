<!doctype html>
<html lang="en" class="page">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Creative bakery</title>
    <link
      rel="stylesheet"
      href="src/styles/main.scss"
    />
    <link
      rel="icon"
      type="image/x-icon"
      href="src/images/favicon.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    >
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap" rel="stylesheet">
  </head>
  <body class="page__body">
    <header class="header">
      <div class="top-bar header__top-bar">
        <div class="top-bar__logo"></div>
        <div class="top-bar__icon-menu"></div>
      </div>
      <div class="header__content">
        <p class="header__description">
          We bake your fantasies — croissants, cakes, cookies, and cupcakes.
        </p>
        <h1 class="header__title">
          Creative bakery
        </h1>
        <img
        src="src/images/Cookie-header.png"
        alt="Cookie"
        class="header__img">
        <button class="header__button">
          Learn more
        </button>
      </div>
    </header>
    <h1>What we bake</h1>
    <script src="src/scripts/main.js"></script>
