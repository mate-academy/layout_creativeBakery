<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Creative Bakery</title>
    <link
      rel="stylesheet"
      href="src/styles/main.scss"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  </head>
  <body>
    <header class="header">
      <div class="header__content">
        <div class="top-bar">
          <a href="#" class="top-bar__logo-link">
            <img
              src="src/images/Bakerlab.svg"
              alt="Creative-Bakery-logo"
              class="top-bar__logo">
          </a>

          <div class="top-bar__nav-links">
            <nav class="nav-menu">
              <ul class="nav-item">
                <li><a href="#" class="nav-link">Products</a></li>
                <li><a href="#" class="nav-link">About Us</a></li>
                <li><a href="#" class="nav-link">Blog</a></li>
              </ul>

              <div class="nav-item--coupl">
                <a href="tel:+12345678" class="icon icon--phone"></a>
                <a href="tel:+12345678" class="nav-link--one">contact us</a>
              </div>
            </nav>

            <a href="#menu" class="icon icon--burger"></a>
          </div>
        </div>

        <div class="container">
          <div class="header__bottom">

            <p class="header__bottom--description">
              We bake your fantasies — croissants, cakes, cookies, and cupcakes.
            </p>

            <img src="src/images/bg-img-heager/Cookie.svg" alt="img" class="header__bottom--img">

            <h1 class="header__bottom__title--text">Creative bakery</h1>

            <div class="header__bottom__button">
              <a href="#" class="icon icon--cookie"></a>
              <a href="#" class="header__bottom__button--text">Learn more</a>
            </div>
          </div>
        </div>
      </div>
    </header>

    <aside class="page__menu menu" id="menu">
      <div class="top-bar menu__top">
        <a href="#" class="top-bar__logo-link">
          <img
            src="src/images/Bakerlab.svg"
            alt="Creative-Bakery-logo"
            class="top-bar__logo">
        </a>

        <a href="#" class="icon icon--close"></a>
      </div>

      <div class="menu__bottom">

        <div class="menu__bottom__nav-links">
          <nav class="menu__bottom__nav-menu">
            <ul class="menu__bottom__nav-item">
              <li><a href="#" class="nav-link">Products</a></li>
              <li><a href="#" class="nav-link">About Us</a></li>
              <li><a href="#" class="nav-link">Blog</a></li>
            </ul>

            <div class="nav-item--coupl">
              <a href="tel:+12345678" class="icon icon--phone"></a>
              <a href="tel:+12345678" class="nav-link--one">contact us</a>
            </div>
          </nav>
      </div>
    </aside>

    <main class="leading">
      <div class="container">
        <div class="leading__content">

        </div>
      </div>
    </main>

    <footer class="footer">
      <div class="container">

      </div>
    </footer>

    <script src="src/scripts/main.js"></script>
  </body>
</html>
